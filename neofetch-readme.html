<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>anisa@arch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #13141e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .terminal {
    width: 100%;
    max-width: 720px;
    background: #1a1b26;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #292e42;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 13.5px;
  }

  .titlebar {
    background: #16161e;
    padding: 11px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #292e42;
    user-select: none;
  }

  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #f7768e; }
  .dot-y { background: #e0af68; }
  .dot-g { background: #9ece6a; }

  .title-text {
    font-size: 12px;
    color: #565f89;
    margin-left: 8px;
    letter-spacing: 0.02em;
  }

  .body {
    padding: 22px 26px 26px;
    min-height: 360px;
    line-height: 0;
  }

  .line {
    display: block;
    line-height: 1.9;
    white-space: pre;
    color: #c0caf5;
    opacity: 0;
    animation: fadein 0.08s forwards;
  }

  @keyframes fadein { to { opacity: 1; } }

  .neo-wrap {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    opacity: 0;
    animation: fadein 0.08s forwards;
  }

  .logo-col { flex-shrink: 0; }
  .info-col { flex: 1; }

  .logo-line {
    display: block;
    line-height: 1.9;
    white-space: pre;
    color: #7aa2f7;
    opacity: 0;
    animation: fadein 0.08s forwards;
  }

  .info-line {
    display: block;
    line-height: 1.9;
    white-space: pre;
    color: #c0caf5;
    opacity: 0;
    animation: fadein 0.08s forwards;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 13px;
    background: #7aa2f7;
    vertical-align: middle;
    margin-left: 1px;
    animation: blink 1.05s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .swatches {
    display: inline-flex;
    gap: 5px;
    vertical-align: middle;
  }

  .sw {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    display: inline-block;
  }

  .c-blue   { color: #7aa2f7; }
  .c-green  { color: #9ece6a; }
  .c-purple { color: #bb9af7; }
  .c-yellow { color: #e0af68; }
  .c-red    { color: #f7768e; }
  .c-cyan   { color: #7dcfff; }
  .c-dim    { color: #565f89; }
  .c-white  { color: #c0caf5; }
</style>
</head>
<body>

<div class="terminal">
  <div class="titlebar">
    <div class="dot dot-r"></div>
    <div class="dot dot-y"></div>
    <div class="dot dot-g"></div>
    <span class="title-text">anisa@arch: ~</span>
  </div>
  <div class="body" id="out"></div>
</div>

<script>
const out = document.getElementById('out');

const LOGO = [
  '              <span class="c-blue">.</span>            ',
  '             <span class="c-blue">/ \\</span>           ',
  '            <span class="c-blue">/   \\</span>          ',
  '           <span class="c-blue">/^.   \\</span>         ',
  '          <span class="c-blue">/  .-.  \\</span>        ',
  '         <span class="c-blue">/  (   ) _\\</span>       ',
  '        <span class="c-blue">/ _.~   ~._^\\</span>      ',
  '       <span class="c-blue">/.^         ^.\\</span>     ',
  '',
  '',
  '',
  '',
];

const INFO = [
  '<span class="c-red">anisa</span><span class="c-dim">@</span><span class="c-red">arch</span>',
  '<span class="c-dim">──────────────────────</span>',
  '<span class="c-blue">OS        </span><span class="c-dim">:</span> Data Science Student',
  '<span class="c-blue">Location  </span><span class="c-dim">:</span> Rome, Italy',
  '<span class="c-blue">Shell     </span><span class="c-dim">:</span> <span class="c-green">Python</span> <span class="c-dim">·</span> <span class="c-cyan">R</span> <span class="c-dim">·</span> <span class="c-yellow">Scala</span>',
  '<span class="c-blue">Packages  </span><span class="c-dim">:</span> sklearn · tidyverse · spark · QGIS',
  '<span class="c-blue">WM        </span><span class="c-dim">:</span> <span class="c-purple">Tableau · Jupyter · RStudio</span>',
  '<span class="c-blue">Focus     </span><span class="c-dim">:</span> <span class="c-purple">ML · Statistics · Spatial Analysis</span>',
  '<span class="c-blue">Uptime    </span><span class="c-dim">:</span> <span class="c-green">open to research internships</span>',
  '<span class="c-blue">Hobbies   </span><span class="c-dim">:</span> <span class="c-red">running</span> <span class="c-dim">·</span> <span class="c-yellow">painting</span>',
  '<span class="c-blue">Contact   </span><span class="c-dim">:</span> <span class="c-cyan">anisabakiu1@icloud.com</span>',
  'SWATCHES',
];

let cursorEl = null;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function appendLine(html, cls = 'line') {
  const s = document.createElement('span');
  s.className = cls;
  s.innerHTML = html;
  out.appendChild(s);
  return s;
}

function addCursor(el) {
  if (cursorEl) cursorEl.remove();
  cursorEl = document.createElement('span');
  cursorEl.className = 'cursor';
  el.appendChild(cursorEl);
}

function removeCursor() {
  if (cursorEl) { cursorEl.remove(); cursorEl = null; }
}

async function typePrompt(cmd) {
  const line = document.createElement('span');
  line.className = 'line';
  line.innerHTML = '<span class="c-green">anisa@arch</span> <span class="c-blue">~</span> <span class="c-white">$ </span>';
  out.appendChild(line);
  addCursor(line);
  await sleep(500);

  const cmdSpan = document.createElement('span');
  cmdSpan.className = 'c-white';
  line.insertBefore(cmdSpan, cursorEl);

  for (const ch of cmd) {
    cmdSpan.textContent += ch;
    await sleep(75 + Math.random() * 50);
  }

  await sleep(350);
  removeCursor();
}

function makeSwatchLine() {
  const span = document.createElement('span');
  span.className = 'info-line';
  const colors = ['#f7768e','#e0af68','#9ece6a','#7dcfff','#7aa2f7','#bb9af7','#c0caf5','#565f89'];
  const wrap = document.createElement('span');
  wrap.className = 'swatches';
  colors.forEach(c => {
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = c;
    wrap.appendChild(sw);
  });
  span.appendChild(wrap);
  return span;
}

async function runNeofetch() {
  const logoCol = document.createElement('div');
  logoCol.className = 'logo-col';
  const infoCol = document.createElement('div');
  infoCol.className = 'info-col';

  const wrap = document.createElement('div');
  wrap.className = 'neo-wrap';
  wrap.appendChild(logoCol);
  wrap.appendChild(infoCol);
  out.appendChild(wrap);

  const count = Math.max(LOGO.length, INFO.length);

  for (let i = 0; i < count; i++) {
    const logoLine = document.createElement('span');
    logoLine.className = 'logo-line';
    logoLine.innerHTML = LOGO[i] || '';
    logoCol.appendChild(logoLine);

    if (INFO[i] === 'SWATCHES') {
      infoCol.appendChild(makeSwatchLine());
    } else {
      const infoLine = document.createElement('span');
      infoLine.className = 'info-line';
      infoLine.innerHTML = INFO[i] || '';
      infoCol.appendChild(infoLine);
    }

    await sleep(55);
  }
}

async function run() {
  await sleep(400);

  await typePrompt('neofetch');
  appendLine('');
  await sleep(150);

  await runNeofetch();
  appendLine('');
  await sleep(200);

  const promptLine = document.createElement('span');
  promptLine.className = 'line';
  promptLine.innerHTML = '<span class="c-green">anisa@arch</span> <span class="c-blue">~</span> <span class="c-white">$ </span>';
  out.appendChild(promptLine);
  addCursor(promptLine);
}

run();
</script>
</body>
</html>
