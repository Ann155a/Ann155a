  <text x="210" y="173" class="blue">Shell     </text><text x="313" y="173" class="dim">: </text>
  <text x="326" y="173" class="green">Python</text><text x="375" y="173" class="dim"> · </text>
  <text x="393" y="173" class="cyan">R</text><text x="404" y="173" class="dim"> · </text>
  <text x="422" y="173" class="yellow">Scala</text>
</g>
<g class="nf-l5 hidden">
  <text x="210" y="194" class="blue">Packages  </text><text x="313" y="194" class="dim">: </text><text x="326" y="194" class="white">sklearn · tidyverse · spark · QGIS</text>
</g>
