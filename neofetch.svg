<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
<defs>
<style>
text{font-family:'Courier New',monospace;font-size:13px;}
.bg{fill:#1a1b26;}.bar{fill:#16161e;}
.blue{fill:#7aa2f7;}.green{fill:#9ece6a;}.purple{fill:#bb9af7;}
.yellow{fill:#e0af68;}.red{fill:#f7768e;}.cyan{fill:#7dcfff;}
.dim{fill:#565f89;}.white{fill:#c0caf5;}.hidden{opacity:0;}
.t-prompt{animation:show 0s .4s both;}
.t-cmd{animation:type-cmd .6s steps(8,end) .9s both;}
.nf-l0{animation:show 0s 1.7s both;}.nf-l1{animation:show 0s 1.78s both;}
.nf-l2{animation:show 0s 1.86s both;}.nf-l3{animation:show 0s 1.94s both;}
.nf-l4{animation:show 0s 2.02s both;}.nf-l5{animation:show 0s 2.10s both;}
.nf-l6{animation:show 0s 2.18s both;}.nf-l7{animation:show 0s 2.26s both;}
.nf-l8{animation:show 0s 2.34s both;}.nf-l9{animation:show 0s 2.42s both;}
.nf-l10{animation:show 0s 2.50s both;}.nf-l11{animation:show 0s 2.58s both;}
.prompt2{animation:show 0s 2.9s both;}
.cur2{animation:show 0s 2.9s both,blink 1s step-end 2.9s infinite;}
@keyframes show{to{opacity:1;}}
@keyframes blink{50%{opacity:0;}}
@keyframes type-cmd{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0% 0 0);}}
.e1{stroke-dasharray:97;stroke-dashoffset:97;animation:draw .35s ease 1.70s forwards;}
.e2{stroke-dasharray:97;stroke-dashoffset:97;animation:draw .35s ease 1.85s forwards;}
.e3{stroke-dasharray:120;stroke-dashoffset:120;animation:draw .35s ease 2.00s forwards;}
.e4{stroke-dasharray:90;stroke-dashoffset:90;animation:draw .30s ease 2.10s forwards;}
.e5{stroke-dasharray:148;stroke-dashoffset:148;animation:draw .40s ease 2.18s forwards;}
.e6{stroke-dasharray:90;stroke-dashoffset:90;animation:draw .30s ease 2.28s forwards;}
.e7{stroke-dasharray:120;stroke-dashoffset:120;animation:draw .35s ease 2.36s forwards;}
.e8{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .32s ease 2.44s forwards;}
.e9{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .32s ease 2.52s forwards;}
.e10{stroke-dasharray:200;stroke-dashoffset:200;animation:draw .45s ease 2.60s forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.npulse{animation:show 0s 2.9s both,pulse 2.8s ease-in-out 3.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
</style>
</defs>

<rect width="720" height="400" rx="12" class="bg"/>
<rect x="0" y="0" width="720" height="12" rx="12" class="bar"/>
<rect x="0" y="0" width="720" height="36" class="bar"/>
<circle cx="18" cy="18" r="6" fill="#f7768e"/>
<circle cx="36" cy="18" r="6" fill="#e0af68"/>
<circle cx="54" cy="18" r="6" fill="#9ece6a"/>
<text x="80" y="23" class="dim" font-size="12">anisa@arch: ~</text>
<rect x="0" y="35" width="720" height="1" fill="#292e42"/>

<g class="t-prompt hidden">
  <text x="20" y="64" class="green">anisa@arch</text>
  <text x="113" y="64" class="blue"> ~</text>
  <text x="130" y="64" class="white"> $ </text>
  <text x="153" y="64" class="white t-cmd">neofetch</text>
</g>

<!-- GRAPH nodes:
  N1 = (100, 90)   top
  N2 = (45,  165)  mid-left
  N3 = (155, 165)  mid-right
  N4 = (45,  240)  lower-left
  N5 = (155, 240)  lower-right
  N6 = (100, 315)  bottom
-->

<!-- edges (drawn from node center, visually stop at circle edge) -->
<g fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.65">
  <line class="e1"  x1="100" y1="90"  x2="45"  y2="165"/>
  <line class="e2"  x1="100" y1="90"  x2="155" y2="165"/>
  <line class="e3"  x1="45"  y1="165" x2="155" y2="165"/>
  <line class="e4"  x1="45"  y1="165" x2="45"  y2="240"/>
  <line class="e5"  x1="155" y1="165" x2="45"  y2="240"/>
  <line class="e6"  x1="155" y1="165" x2="155" y2="240"/>
  <line class="e7"  x1="45"  y1="240" x2="155" y2="240"/>
  <line class="e8"  x1="45"  y1="240" x2="100" y2="315"/>
  <line class="e9"  x1="155" y1="240" x2="100" y2="315"/>
  <line class="e10" x1="100" y1="90"  x2="155" y2="240"/>
</g>

<!-- nodes on top -->
<g class="npulse hidden">
  <circle cx="100" cy="90"  r="8" fill="#7aa2f7"/>
  <circle cx="45"  cy="165" r="7" fill="#bb9af7"/>
  <circle cx="155" cy="165" r="7" fill="#bb9af7"/>
  <circle cx="45"  cy="240" r="7" fill="#9ece6a"/>
  <circle cx="155" cy="240" r="7" fill="#9ece6a"/>
  <circle cx="100" cy="315" r="8" fill="#f7768e"/>
</g>

<!-- INFO LINES (x=210 to leave graph space) -->
<g class="nf-l0 hidden">
  <text x="210" y="90" class="red">anisa</text><text x="255" y="90" class="dim">@</text><text x="266" y="90" class="red">arch</text>
</g>
<g class="nf-l1 hidden"><text x="210" y="110" class="dim">──────────────────────</text></g>
<g class="nf-l2 hidden">
  <text x="210" y="131" class="blue">OS        </text><text x="313" y="131" class="dim">: </text><text x="326" y="131" class="white">Data Science Student</text>
</g>
