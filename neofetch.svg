</g>
<g class="nf-l7 hidden">
  <text x="210" y="236" class="blue">Focus     </text><text x="313" y="236" class="dim">: </text><text x="326" y="236" class="purple">ML · Statistics · Graphs</text>
</g>
<g class="nf-l8 hidden">
  <text x="210" y="257" class="blue">Uptime    </text><text x="313" y="257" class="dim">: </text><text x="326" y="257" class="green">open to work &amp; research</text>
</g>
<g class="nf-l9 hidden">
  <text x="210" y="278" class="blue">Hobbies   </text><text x="313" y="278" class="dim">: </text>
  <text x="326" y="278" class="red">running</text><text x="381" y="278" class="dim"> · </text><text x="399" y="278" class="yellow">painting</text>
</g>
<g class="nf-l10 hidden">
  <text x="210" y="299" class="blue">Contact   </text><text x="313" y="299" class="dim">: </text><text x="326" y="299" class="cyan">anisabakiu1@icloud.com</text>
</g>
<g class="nf-l11 hidden">
  <rect x="210" y="315" width="16" height="16" rx="3" fill="#f7768e"/>
  <rect x="230" y="315" width="16" height="16" rx="3" fill="#e0af68"/>
  <rect x="250" y="315" width="16" height="16" rx="3" fill="#9ece6a"/>
  <rect x="270" y="315" width="16" height="16" rx="3" fill="#7dcfff"/>
  <rect x="290" y="315" width="16" height="16" rx="3" fill="#7aa2f7"/>
  <rect x="310" y="315" width="16" height="16" rx="3" fill="#bb9af7"/>
  <rect x="330" y="315" width="16" height="16" rx="3" fill="#c0caf5"/>
  <rect x="350" y="315" width="16" height="16" rx="3" fill="#565f89"/>
</g>

<g class="prompt2 hidden">
  <text x="20" y="378" class="green">anisa@arch</text>
  <text x="113" y="378" class="blue"> ~</text>
  <text x="130" y="378" class="white"> $ </text>
</g>
<rect x="153" y="365" width="8" height="14" class="cur2 hidden"/>

</svg>
