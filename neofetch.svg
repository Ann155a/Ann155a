<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
<defs>
<style>
text { font-family: 'Courier New', monospace; font-size: 13px; }
.bg  { fill: #1a1b26; }
.bar { fill: #16161e; }
.blue   { fill: #7aa2f7; }
.green  { fill: #9ece6a; }
.purple { fill: #bb9af7; }
.yellow { fill: #e0af68; }
.red    { fill: #f7768e; }
.cyan   { fill: #7dcfff; }
.dim    { fill: #565f89; }
.white  { fill: #c0caf5; }
.hidden { opacity: 0; }

.t-prompt { animation: show 0s 0.4s both; }
.t-cmd    { animation: type-cmd 0.6s steps(8,end) 0.9s both; }

.nf-l0  { animation: show 0s 1.7s both; }
.nf-l1  { animation: show 0s 1.78s both; }
.nf-l2  { animation: show 0s 1.86s both; }
.nf-l3  { animation: show 0s 1.94s both; }
.nf-l4  { animation: show 0s 2.02s both; }
.nf-l5  { animation: show 0s 2.10s both; }
.nf-l6  { animation: show 0s 2.18s both; }
.nf-l7  { animation: show 0s 2.26s both; }
.nf-l8  { animation: show 0s 2.34s both; }
.nf-l9  { animation: show 0s 2.42s both; }
.nf-l10 { animation: show 0s 2.50s both; }
.nf-l11 { animation: show 0s 2.58s both; }

.prompt2 { animation: show 0s 2.9s both; }
.cur2    { animation: show 0s 2.9s both, blink 1s step-end 2.9s infinite; }

@keyframes show { to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes type-cmd {
  from { clip-path: inset(0 100% 0 0); }
  to   { clip-path: inset(0 0% 0 0); }
}

/* edge draw animations */
.e1  { stroke-dasharray: 60;  stroke-dashoffset: 60;  animation: draw 0.4s ease 1.7s forwards; }
.e2  { stroke-dasharray: 55;  stroke-dashoffset: 55;  animation: draw 0.4s ease 1.9s forwards; }
.e3  { stroke-dasharray: 70;  stroke-dashoffset: 70;  animation: draw 0.4s ease 2.0s forwards; }
.e4  { stroke-dasharray: 65;  stroke-dashoffset: 65;  animation: draw 0.4s ease 2.1s forwards; }
.e5  { stroke-dasharray: 80;  stroke-dashoffset: 80;  animation: draw 0.4s ease 2.2s forwards; }
.e6  { stroke-dasharray: 50;  stroke-dashoffset: 50;  animation: draw 0.4s ease 2.3s forwards; }
.e7  { stroke-dasharray: 75;  stroke-dashoffset: 75;  animation: draw 0.4s ease 2.4s forwards; }
.e8  { stroke-dasharray: 90;  stroke-dashoffset: 90;  animation: draw 0.4s ease 2.45s forwards; }
.e9  { stroke-dasharray: 60;  stroke-dashoffset: 60;  animation: draw 0.4s ease 2.5s forwards; }
.e10 { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 0.4s ease 2.55s forwards; }

@keyframes draw { to { stroke-dashoffset: 0; } }

/* node pulse */
.n-pulse { animation: show 0s 1.7s both, pulse 2.5s ease-in-out 3s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.5; }
}
</style>
</defs>

<!-- background -->
<rect width="720" height="420" rx="12" class="bg"/>

<!-- titlebar -->
<rect x="0" y="0" width="720" height="36" rx="0" class="bar"/>
<rect x="0" y="0" width="720" height="12" rx="12" class="bar"/>
<circle cx="18" cy="18" r="6" fill="#f7768e"/>
<circle cx="36" cy="18" r="6" fill="#e0af68"/>
<circle cx="54" cy="18" r="6" fill="#9ece6a"/>
<text x="80" y="23" class="dim" font-size="12">anisa@arch: ~</text>
<rect x="0" y="35" width="720" height="1" fill="#292e42"/>

<!-- PROMPT LINE -->
<g class="t-prompt hidden">
  <text x="20" y="66" class="green">anisa@arch</text>
  <text x="113" y="66" class="blue"> ~</text>
  <text x="130" y="66" class="white"> $ </text>
  <text x="153" y="66" class="white t-cmd">neofetch</text>
</g>

<!-- ========== GRAPH (left side, replaces arch logo) ========== -->
<!-- nodes: 
  A (100, 100)  top-left
  B (55,  175)  mid-left
  C (145, 175)  mid-center-left
  D (80,  255)  bottom-left
  E (165, 255)  bottom-center
  F (100, 315)  bottom
-->

<!-- edges drawn first -->
<g fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.6">
  <line x1="100" y1="100" x2="55"  y2="175" class="e1"/>
  <line x1="100" y1="100" x2="145" y2="175" class="e2"/>
  <line x1="55"  y1="175" x2="145" y2="175" class="e3"/>
  <line x1="55"  y1="175" x2="80"  y2="255" class="e4"/>
  <line x1="145" y1="175" x2="165" y2="255" class="e5"/>
  <line x1="80"  y1="255" x2="165" y2="255" class="e6"/>
  <line x1="80"  y1="255" x2="100" y2="315" class="e7"/>
  <line x1="165" y1="255" x2="100" y2="315" class="e8"/>
  <line x1="145" y1="175" x2="80"  y2="255" class="e9"/>
  <line x1="55"  y1="175" x2="165" y2="255" class="e10"/>
</g>

<!-- nodes -->
<g class="n-pulse">
  <circle cx="100" cy="100" r="7" fill="#7aa2f7"/>
  <circle cx="55"  cy="175" r="6" fill="#bb9af7"/>
  <circle cx="145" cy="175" r="6" fill="#bb9af7"/>
  <circle cx="80"  cy="255" r="6" fill="#9ece6a"/>
  <circle cx="165" cy="255" r="6" fill="#9ece6a"/>
  <circle cx="100" cy="315" r="7" fill="#f7768e"/>
</g>

<!-- ========== INFO LINES (right side) ========== -->
<g class="nf-l0 hidden">
  <text x="230" y="93" class="red">anisa</text>
  <text x="275" y="93" class="dim">@</text>
  <text x="286" y="93" class="red">arch</text>
</g>
<g class="nf-l1 hidden"><text x="230" y="113" class="dim">──────────────────────</text></g>
<g class="nf-l2 hidden">
  <text x="230" y="133" class="blue">OS        </text><text x="332" y="133" class="dim">: </text><text x="345" y="133" class="white">Data Science Student</text>
</g>
<g class="nf-l3 hidden">
  <text x="230" y="153" class="blue">Location  </text><text x="332" y="153" class="dim">: </text><text x="345" y="153" class="white">Bari, Italy</text>
</g>
<g class="nf-l4 hidden">
  <text x="230" y="173" class="blue">Shell     </text><text x="332" y="173" class="dim">: </text>
  <text x="345" y="173" class="green">Python</text>
  <text x="395" y="173" class="dim"> · </text>
  <text x="413" y="173" class="cyan">R</text>
  <text x="424" y="173" class="dim"> · </text>
  <text x="442" y="173" class="yellow">Scala</text>
</g>
<g class="nf-l5 hidden">
  <text x="230" y="193" class="blue">Packages  </text><text x="332" y="193" class="dim">: </text><text x="345" y="193" class="white">sklearn · tidyverse · spark · QGIS</text>
</g>
<g class="nf-l6 hidden">
  <text x="230" y="213" class="blue">WM        </text><text x="332" y="213" class="dim">: </text><text x="345" y="213" class="purple">Tableau · Jupyter · RStudio</text>
</g>
<g class="nf-l7 hidden">
  <text x="230" y="233" class="blue">Focus     </text><text x="332" y="233" class="dim">: </text><text x="345" y="233" class="purple">ML · Statistics · Graphs</text>
</g>
<g class="nf-l8 hidden">
  <text x="230" y="253" class="blue">Uptime    </text><text x="332" y="253" class="dim">: </text><text x="345" y="253" class="green">open to work &amp; research</text>
</g>
<g class="nf-l9 hidden">
  <text x="230" y="273" class="blue">Hobbies   </text><text x="332" y="273" class="dim">: </text>
  <text x="345" y="273" class="red">running</text>
  <text x="400" y="273" class="dim"> · </text>
  <text x="418" y="273" class="yellow">painting</text>
</g>
<g class="nf-l10 hidden">
  <text x="230" y="293" class="blue">Contact   </text><text x="332" y="293" class="dim">: </text><text x="345" y="293" class="cyan">anisabakiu1@icloud.com</text>
</g>

<!-- swatches -->
<g class="nf-l11 hidden">
  <rect x="230" y="310" width="16" height="16" rx="3" fill="#f7768e"/>
  <rect x="250" y="310" width="16" height="16" rx="3" fill="#e0af68"/>
  <rect x="270" y="310" width="16" height="16" rx="3" fill="#9ece6a"/>
  <rect x="290" y="310" width="16" height="16" rx="3" fill="#7dcfff"/>
  <rect x="310" y="310" width="16" height="16" rx="3" fill="#7aa2f7"/>
  <rect x="330" y="310" width="16" height="16" rx="3" fill="#bb9af7"/>
  <rect x="350" y="310" width="16" height="16" rx="3" fill="#c0caf5"/>
  <rect x="370" y="310" width="16" height="16" rx="3" fill="#565f89"/>
</g>

<!-- final prompt + cursor -->
<g class="prompt2 hidden">
  <text x="20" y="375" class="green">anisa@arch</text>
  <text x="113" y="375" class="blue"> ~</text>
  <text x="130" y="375" class="white"> $ </text>
</g>
<rect x="153" y="362" width="8" height="14" class="cur2 hidden"/>

</svg>
