  <line x1="129" y1="180" x2="176" y2="288"/>
  <line x1="129" y1="225" x2="176" y2="128"/>
  <line x1="129" y1="225" x2="176" y2="208"/>
  <line x1="129" y1="225" x2="176" y2="288"/>
  <line x1="129" y1="270" x2="176" y2="128"/>
