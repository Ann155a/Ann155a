<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
<title>Neofetch-style terminal for Anisa on Arch Linux</title>
<desc>Animated terminal showing system info with a neural network visualization</desc>
<defs>
<style>
text{font-family:'Courier New',monospace;font-size:13px;}
.bg{fill:#1a1b26;}
.bar{fill:#16161e;}
.blue{fill:#7aa2f7;}
.green{fill:#9ece6a;}
.purple{fill:#bb9af7;}
.yellow{fill:#e0af68;}
.red{fill:#f7768e;}
.cyan{fill:#7dcfff;}
.dim{fill:#565f89;}
.white{fill:#c0caf5;}
.hidden{opacity:0;}

.t-prompt{animation:show 0s .4s both;}
.t-cmd{animation:type-cmd .6s steps(8,end) .9s both;}

.nf-l0{animation:show 0s 1.9s both;}
.nf-l1{animation:show 0s 1.98s both;}
.nf-l2{animation:show 0s 2.06s both;}
.nf-l3{animation:show 0s 2.14s both;}
.nf-l4{animation:show 0s 2.22s both;}
.nf-l5{animation:show 0s 2.30s both;}
.nf-l6{animation:show 0s 2.38s both;}
.nf-l7{animation:show 0s 2.46s both;}
.nf-l8{animation:show 0s 2.54s both;}
.nf-l9{animation:show 0s 2.62s both;}
.nf-l10{animation:show 0s 2.70s both;}
.nf-l11{animation:show 0s 2.78s both;}
.nf-l12{animation:show 0s 2.86s both;}

.prompt2{animation:show 0s 3.2s both;}
.cur2{animation:show 0s 3.2s both,blink 1s step-end 3.2s infinite;}

@keyframes show{to{opacity:1;}}
@keyframes blink{50%{opacity:0;}}
@keyframes type-cmd{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0% 0 0);}}

.nl1{animation:show 0s 1.50s both;}
.nl2{animation:show 0s 1.60s both;}
.nl3{animation:show 0s 1.70s both;}
.nl4{animation:show 0s 1.80s both;}
.nl5{animation:show 0s 1.88s both;}

.el1{animation:show 0s 1.55s both;}
.el2{animation:show 0s 1.65s both;}
.el3{animation:show 0s 1.75s both;}
.el4{animation:show 0s 1.83s both;}

.npulse{animation:show 0s 3.2s both, pulse 2.6s ease-in-out 3.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.sig{stroke-dasharray:5 180;stroke-dashoffset:0;animation:travel 2s linear infinite;}
@keyframes travel{to{stroke-dashoffset:-185;}}
.sig.d1{animation-delay:0s;}
.sig.d2{animation-delay:.5s;}
.sig.d3{animation-delay:1s;}
.sig.d4{animation-delay:1.5s;}
.sig.d5{animation-delay:.25s;}
.sig.d6{animation-delay:.75s;}
.sig.d7{animation-delay:1.25s;}
.sig.d8{animation-delay:1.75s;}
.sig.d9{animation-delay:.4s;}
.sig.d10{animation-delay:.9s;}
.sig.d11{animation-delay:1.4s;}
.sig.d12{animation-delay:.6s;}
.sig.d13{animation-delay:1.1s;}

.arch-logo{animation:show 0s 1.50s both;}
</style>
</defs>

<!-- Terminal chrome -->
<rect width="720" height="420" rx="12" class="bg"/>
<rect x="0" y="0" width="720" height="36" rx="4" class="bar"/>
<!-- Arch Linux window buttons -->
<circle cx="18" cy="18" r="6" fill="#444c6a"/>
<circle cx="36" cy="18" r="6" fill="#444c6a"/>
<circle cx="54" cy="18" r="6" fill="#444c6a"/>
<!-- Arch diamond on the active button -->
<polygon points="18,13 22,18 18,23 14,18" fill="#7aa2f7" opacity="0.85"/>
<text x="80" y="23" class="dim" font-size="12">anisa@arch ~ — neofetch</text>
<rect x="0" y="35" width="720" height="1" fill="#292e42"/>

<!-- Prompt line -->
<g class="t-prompt hidden">
  <text x="20" y="64" class="green">anisa@arch</text>
  <text x="113" y="64" class="dim"> ❯ </text>
  <text x="137" y="64" class="white t-cmd">neofetch</text>
</g>

<!-- NEURAL NETWORK: 5 layers — 5 input, 4 hidden1, 5 hidden2, 3 hidden3, 2 output -->

<!-- Edges L1→L2 -->
<g class="el1 hidden" fill="none" stroke="#2e3257" stroke-width="0.6">
  <line x1="35" y1="88"  x2="82" y2="105"/>
  <line x1="35" y1="88"  x2="82" y2="148"/>
  <line x1="35" y1="88"  x2="82" y2="191"/>
  <line x1="35" y1="88"  x2="82" y2="234"/>
  <line x1="35" y1="128" x2="82" y2="105"/>
  <line x1="35" y1="128" x2="82" y2="148"/>
  <line x1="35" y1="128" x2="82" y2="191"/>
  <line x1="35" y1="128" x2="82" y2="234"/>
  <line x1="35" y1="168" x2="82" y2="105"/>
  <line x1="35" y1="168" x2="82" y2="148"/>
  <line x1="35" y1="168" x2="82" y2="191"/>
  <line x1="35" y1="168" x2="82" y2="234"/>
  <line x1="35" y1="208" x2="82" y2="105"/>
  <line x1="35" y1="208" x2="82" y2="148"/>
  <line x1="35" y1="208" x2="82" y2="191"/>
  <line x1="35" y1="208" x2="82" y2="234"/>
  <line x1="35" y1="248" x2="82" y2="105"/>
  <line x1="35" y1="248" x2="82" y2="148"/>
  <line x1="35" y1="248" x2="82" y2="191"/>
  <line x1="35" y1="248" x2="82" y2="234"/>
</g>

<!-- Edges L2→L3 -->
<g class="el2 hidden" fill="none" stroke="#2e3257" stroke-width="0.6">
  <line x1="82" y1="105" x2="129" y2="90"/>
  <line x1="82" y1="105" x2="129" y2="135"/>
  <line x1="82" y1="105" x2="129" y2="180"/>
